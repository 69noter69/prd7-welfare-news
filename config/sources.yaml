# ============================================================
#  ตั้งค่าระบบเก็บข่าวสวัสดิการ — สปข.7
#  ไฟล์นี้แก้ได้เองบนเว็บ GitHub ไม่ต้องใช้โปรแกรมเมอร์
#  กฎ 3 ข้อ: ห้ามใช้ Tab (ใช้เว้นวรรคเท่านั้น) / ขีด - ต้องตรงกัน / แก้ทีละนิดแล้วดูผล
# ============================================================

timezone: Asia/Bangkok

# ---------- เกณฑ์คัดกรอง ----------
window_hours: 26              # ย้อนดูข่าวหลังกี่ชั่วโมง (26 = เผื่อเหลื่อมกันไม่ให้ข่าวหลุด)
max_ai_items: 60              # ส่งให้ AI อ่านไม่เกินกี่ข่าวต่อวัน  ** ตัวคุมค่าใช้จ่ายหลัก **
min_prefilter_score: 2        # คะแนนคำสำคัญขั้นต่ำ ต่ำกว่านี้ไม่ส่งให้ AI
keep_min_score: 45            # คะแนนจาก AI ขั้นต่ำที่จะขึ้นเว็บ (ข่าวทั่วประเทศ)
keep_min_score_eastern: 25    # เกณฑ์ข่าวภาคตะวันออก ตั้งต่ำกว่าเพื่อไม่ให้แท็บภูมิภาคว่าง
summary_words: "40-70"        # ความยาวสรุปที่สั่ง AI  ** ตัวคุมค่าใช้จ่ายรองลงมา **
batch_size: 10                # ส่งให้ AI ทีละกี่ข่าว
first_seen_lookback_days: 7   # ย้อนดูกี่วันเพื่อติดป้าย "ตามต่อจาก..."

model: claude-haiku-4-5       # ตรวจชื่อรุ่นล่าสุดได้ที่ docs.claude.com

# ---------- ราคา (ไว้คำนวณค่าใช้จ่ายโดยประมาณ) ----------
# ดูราคาจริงที่ console.anthropic.com ถ้าใส่ 0 ระบบจะไม่คำนวณและแสดง "-" แทน
pricing:
  input_per_mtok_usd: 1.00
  output_per_mtok_usd: 5.00
  usd_to_thb: 36.5

# ---------- พื้นที่ สปข.7 ----------
eastern_provinces: [จันทบุรี, ตราด, ระยอง, ชลบุรี, ฉะเชิงเทรา, ปราจีนบุรี, สระแก้ว, นครนายก]

# ============================================================
#  บัญชีดำ — ไม่เอาข่าวจากแหล่งของเราเอง
#  (สำนักข่าวกรมประชาสัมพันธ์ส่วนกลาง thainews.prd.go.th ยังเก็บไว้)
# ============================================================
exclude_domains:
  - region7.prd.go.th
  - facebook.com
  - m.facebook.com

exclude_url_patterns:
  - "*thainews.prd.go.th*/region/7*"

exclude_sources:
  - สำนักประชาสัมพันธ์เขต 7
  - สำนักงานประชาสัมพันธ์เขต 7
  - สปข.7
  - สปข. 7
  - สปข.๗

# ============================================================
#  แหล่งข่าว
#  ถ้าอันไหนเสีย ให้ลบทั้ง 2 บรรทัด (name กับ url) ออกไปเลย
# ============================================================
feeds:
  # ผ่านการทดสอบจริงเมื่อ 10 ก.ย. 2569 — ใช้งานได้ทั้ง 7 แห่ง
  - name: มติชน
    url: https://www.matichon.co.th/feed
  - name: ข่าวสด
    url: https://www.khaosod.co.th/feed
  - name: ประชาชาติธุรกิจ
    url: https://www.prachachat.net/feed
  - name: ไทยรัฐ
    url: https://www.thairath.co.th/rss/news
  - name: ThaiPublica
    url: https://thaipublica.org/feed/
  - name: Hfocus
    url: https://www.hfocus.org/rss.xml
  - name: ประชาไท
    url: https://prachatai.com/rss

  # --- ที่ถูกตัดออกเพราะบล็อกเซิร์ฟเวอร์ต่างประเทศ (ทดสอบ 10 ก.ย. 2569) ---
  # สำนักข่าว กรมประชาสัมพันธ์ / Thai PBS / กรุงเทพธุรกิจ / สำนักข่าวอิศรา
  # เดลินิวส์ / ฐานเศรษฐกิจ / TNN Thailand / PPTV HD36
  # ข่าวจากสำนักเหล่านี้ยังเข้าระบบได้ทางคำค้น Google News ด้านล่าง

# แหล่งข่าวภูมิภาค — ข่าวจากตรงนี้จะได้คะแนนบวกเพิ่ม 2
regional_feeds: []
# ทดสอบ 10 ก.ย. 2569 แล้วเสียทั้งหมด (77ข่าวเด็ด / MGR ภูมิภาค / แนวหน้า / สยามรัฐ)
# ข่าวภูมิภาคตอนนี้พึ่งคำค้นรายจังหวัดใน regional_query_templates เป็นหลัก

# ============================================================
#  คำค้นหาผ่าน Google News (ฟรี ไม่ต้องใช้กุญแจ)
#  เพิ่มบรรทัดใหม่ได้เลย ขึ้นต้นด้วย "  - "
# ============================================================
google_news_queries:
  - บัตรสวัสดิการแห่งรัฐ
  - ผู้มีรายได้น้อย
  - สวัสดิการรัฐ
  - เบี้ยยังชีพผู้สูงอายุ
  - เบี้ยความพิการ
  - เงินอุดหนุนเด็กแรกเกิด
  - หนี้นอกระบบ
  - แก้หนี้ครัวเรือน
  - ค่าครองชีพ
  - เงินดิจิทัล OR "ดิจิทัลวอลเล็ต"
  - บัตรทอง OR สปสช.
  - ประกันสังคม มาตรา 40
  - ค่าแรงขั้นต่ำ
  - บ้านเพื่อคนไทย OR การเคหะ
  - เยียวยา น้ำท่วม
  - เกษตรกร ช่วยเหลือ ไร่ละ
  - กยศ.
  # --- กลุ่ม C: หน่วยงานต้นทาง ---
  - สปสช. ประกาศ OR สิทธิบัตรทอง
  - สำนักงานประกันสังคม ผู้ประกันตน
  - ประกันสังคม มาตรา 33 OR มาตรา 39
  - กรมบัญชีกลาง จ่ายเงิน OR โอนเงิน
  - ธ.ก.ส. เกษตรกร สินเชื่อ OR พักหนี้
  - กระทรวงการพัฒนาสังคม พม. ช่วยเหลือ
  - ศูนย์ช่วยเหลือสังคม 1300

# คำค้นรายจังหวัด — ระบบจะเอา {province} ไปแทนด้วย 8 จังหวัดข้างบนให้เอง
regional_query_templates:
  - "{province} สวัสดิการ OR ผู้มีรายได้น้อย OR เบี้ยยังชีพ"
  - "{province} เยียวยา OR ช่วยเหลือ OR หนี้นอกระบบ"
  - "{province} พม. OR พัฒนาสังคม OR กลุ่มเปราะบาง"

# ============================================================
#  คำสำคัญ — ใช้ให้คะแนนก่อนส่งให้ AI (ยิ่งตรงยิ่งได้คะแนนสูง)
# ============================================================
keywords:
  strong: [บัตรสวัสดิการ, บัตรคนจน, ผู้มีรายได้น้อย, สวัสดิการรัฐ, สวัสดิการแห่งรัฐ, เบี้ยยังชีพ, เบี้ยผู้สูงอายุ, เบี้ยความพิการ, เงินอุดหนุนบุตร, เงินอุดหนุนเด็ก, หนี้นอกระบบ, บัตรทอง, สปสช., เงินดิจิทัล, ดิจิทัลวอลเล็ต, คนละครึ่ง, เราชนะ, ค่าแรงขั้นต่ำ, กยศ., เยียวยา]
  medium: [สวัสดิการ, ค่าครองชีพ, ประกันสังคม, การเคหะ, ที่อยู่อาศัย, คนพิการ, ผู้สูงอายุ, เกษตรกร, ชาวนา, ชาวประมง, แรงงาน, ค่าจ้าง, ราคาน้ำมัน, ค่าไฟ, หนี้ครัวเรือน, พักหนี้, มาตรการช่วยเหลือ, ลดภาระ, กลุ่มเปราะบาง, ยากจน, คนจน]
  weak: [กระทรวงการคลัง, พม., กระทรวงการพัฒนาสังคม, กรมบัญชีกลาง, ธ.ก.ส., ออมสิน, ครม., คลัง, สิทธิ, ลงทะเบียน]
  exclude: [หวย, สลาก, ดวง, ดารา, ละคร, ฟุตบอล, พรีเมียร์ลีก, ราคาทอง, แทงบอล]
